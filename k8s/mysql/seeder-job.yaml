apiVersion: batch/v1
kind: Job
metadata:
  name: wms-db-seeder
  namespace: wms
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seeder
          image: akshatpandya04/wms-seeder:latest
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wms-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "mysql+pymysql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          envFrom:
            - configMapRef:
                name: wms-config